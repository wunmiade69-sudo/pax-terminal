name: Build PAX Terminal APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pax-terminal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debian ARM64 Android terminal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git gzip make patch perl tar wget

      - name: Build Android-compatible PRoot runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/green-green-avk/build-proot-android.git "$RUNNER_TEMP/build-proot-android"
          cd "$RUNNER_TEMP/build-proot-android"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then echo "Android SDK path was not set." >&2; exit 1; fi
          sed -i "s|^ARCHS=.*|ARCHS='aarch64'|" config
          sed -i "s|^NDK=.*|NDK=\"$SDK_ROOT/ndk/23.2.8568313\"|" config

          # The upstream script pins talloc 2.1.14, whose bundled Waf uses
          # Python 2 exception syntax and fails under the Python 3 runner.
          # Use the newer talloc 2.4.3 build tooling instead.
          if grep -qE '^[[:space:]]*TALLOC_V=' config; then
            sed -i -E 's|^[[:space:]]*TALLOC_V=.*|TALLOC_V=2.4.3|' config
          elif grep -qE '^[[:space:]]*TALLOC_VERSION=' config; then
            sed -i -E 's|^[[:space:]]*TALLOC_VERSION=.*|TALLOC_VERSION=2.4.3|' config
          else
            # Compatibility fallback if the upstream config stores only the version literal.
            sed -i 's/2\.1\.14/2.4.3/g' config
          fi
          if ! grep -q '2.4.3' config; then
            echo 'Could not pin the talloc build dependency to 2.4.3.' >&2
            exit 1
          fi
          echo 'Pinned talloc build dependency:'
          grep -n '2.4.3' config

          # talloc's replace_testsuite fixture calls telldir()/seekdir().
          # Android exposes these functions from API 23, while this app's
          # minimum supported API is 26. The upstream build config defaults
          # to API 21, which produces implicit-declaration warnings and
          # undefined-symbol failures while linking replace_testsuite.
          sed -i 's/else API=21/else API=26/' config
          if ! grep -qE '^[[:space:]]*else API=26$' config; then
            echo 'Could not set the PRoot native build API to 26 (telldir/seekdir require API 23+).' >&2
            exit 1
          fi
          echo 'Configured PRoot/talloc native API baseline:'
          grep -n 'API=26' config
          test -x "$SDK_ROOT/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          ./build.sh
          ./make-proot-for-apk.sh
          # make-proot-for-apk.sh sets PREFIX="$INSTALL_ROOT-apk".
          # In upstream config INSTALL_ROOT="$BUILD_DIR/root-$ARCH/root", so
          # the real output directory is build/root-aarch64/root-apk/bin.
          # The previous workflow used the wrong staging path.
          PROOT_BIN_DIR="build/root-aarch64/root-apk/bin"
          if [[ ! -s "$PROOT_BIN_DIR/libproot-userland.so" || ! -s "$PROOT_BIN_DIR/libproot-loader.so" ]]; then
            echo "Expected PRoot APK binaries were not found in $PROOT_BIN_DIR." >&2
            echo "Generated files under build/root-aarch64:" >&2
            find build/root-aarch64 -maxdepth 6 -type f -print | sort >&2 || true
            exit 1
          fi
          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp "$PROOT_BIN_DIR/libproot-userland.so" "$DEST/"
          cp "$PROOT_BIN_DIR/libproot-loader.so" "$DEST/"
          chmod 755 "$DEST"/*.so
          test -s "$DEST/libproot-userland.so"
          test -s "$DEST/libproot-loader.so"
          file "$DEST/libproot-userland.so" "$DEST/libproot-loader.so"

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian ARM64 developer environment
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --file runtime/Dockerfile.debian \
            --tag pax-terminal-rootfs:trixie .
          docker run --rm --platform linux/arm64 pax-terminal-rootfs:trixie \
            bash -lc 'bash --version | head -n 1 && apt-get --version | head -n 1 && git --version && curl --version | head -n 1'
          container_id="$(docker create --platform linux/arm64 pax-terminal-rootfs:trixie)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p app/src/main/assets
          docker export "$container_id" | gzip -9 > app/src/main/assets/debian-rootfs-arm64.rootfs
          gzip -t app/src/main/assets/debian-rootfs-arm64.rootfs
          tar -tzf app/src/main/assets/debian-rootfs-arm64.rootfs >/dev/null
          ls -lh app/src/main/assets/debian-rootfs-arm64.rootfs
          docker rm "$container_id"
          trap - EXIT

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Validate project source
        run: bash scripts/validate-source.sh

      - name: Check large asset packaging and Gradle memory settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'noCompress += "rootfs"' app/build.gradle.kts
          grep -Fq 'org.gradle.jvmargs=-Xmx4g' gradle.properties
          grep -Fq 'org.gradle.parallel=false' gradle.properties
          echo 'gzip assets will be stored without recompression; Gradle workers are bounded.'

      - name: Build debug APK
        run: gradle --no-daemon --max-workers=2 --stacktrace clean assembleDebug

      - name: Verify APK and bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "APK is missing or empty: $APK" >&2
            echo "APK outputs found:" >&2
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null | sort >&2 || true
            exit 1
          fi

          # Do not pipe unzip directly into grep -q while pipefail is enabled:
          # grep can exit early and cause unzip to receive SIGPIPE. Save the
          # complete archive entry list, then check exact paths in that file.
          APK_ENTRIES="$RUNNER_TEMP/pax-terminal-apk-entries.txt"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          echo "Relevant bundled APK entries:"
          grep -E '(^|/)(libproot-userland\.so|libproot-loader\.so|debian-rootfs-arm64\.rootfs)$' "$APK_ENTRIES" || true

          required_entries=(
            'lib/arm64-v8a/libproot-userland.so'
            'lib/arm64-v8a/libproot-loader.so'
            'assets/debian-rootfs-arm64.rootfs'
          )
          for required in "${required_entries[@]}"; do
            if ! grep -Fxq "$required" "$APK_ENTRIES"; then
              echo "Required APK entry is missing: $required" >&2
              echo "Full APK entry list follows:" >&2
              cat "$APK_ENTRIES" >&2
              exit 1
            fi
          done

          sha256sum "$APK" > "$APK.sha256"
          echo "APK SHA-256: $(cut -d ' ' -f 1 "$APK.sha256")"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: pax-terminal-v0.4.7-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
