name: Build PAX Terminal APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pax-terminal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debian ARM64 Android terminal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git gzip make patch perl tar wget

      - name: Build Android-compatible PRoot runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/green-green-avk/build-proot-android.git "$RUNNER_TEMP/build-proot-android"
          cd "$RUNNER_TEMP/build-proot-android"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then echo "Android SDK path was not set." >&2; exit 1; fi
          sed -i "s|^ARCHS=.*|ARCHS='aarch64'|" config
          sed -i "s|^NDK=.*|NDK=\"$SDK_ROOT/ndk/23.2.8568313\"|" config
          test -x "$SDK_ROOT/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          ./build.sh
          ./make-proot-for-apk.sh
          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp build/root-aarch64-apk/root/bin/libproot-userland.so "$DEST/"
          cp build/root-aarch64-apk/root/bin/libproot-loader.so "$DEST/"
          chmod 755 "$DEST"/*.so
          test -s "$DEST/libproot-userland.so"
          test -s "$DEST/libproot-loader.so"
          file "$DEST/libproot-userland.so" "$DEST/libproot-loader.so"

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian ARM64 developer environment
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --file runtime/Dockerfile.debian \
            --tag pax-terminal-rootfs:trixie .
          docker run --rm --platform linux/arm64 pax-terminal-rootfs:trixie \
            bash -lc 'node --version && npm --version && pnpm --version && tsc --version && tsx --version && python --version && git --version && deno --version && bun --version && bash --version | head -n 1'
          container_id="$(docker create --platform linux/arm64 pax-terminal-rootfs:trixie)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p app/src/main/assets
          docker export "$container_id" | gzip -1 > app/src/main/assets/debian-rootfs-arm64.tar.gz
          gzip -t app/src/main/assets/debian-rootfs-arm64.tar.gz
          tar -tzf app/src/main/assets/debian-rootfs-arm64.tar.gz >/dev/null
          ls -lh app/src/main/assets/debian-rootfs-arm64.tar.gz
          docker rm "$container_id"
          trap - EXIT

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Validate project source
        run: bash scripts/validate-source.sh

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK and bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot-userland.so'
          unzip -l "$APK" | grep -q 'assets/debian-rootfs-arm64.tar.gz'
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: pax-terminal-v0.4.0-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
